<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Source of the link preview (WhatsApp, iMessage, social): src/app/opengraph-image.png.
     The text avoids both A/B headlines on purpose, so a shared link doesn't show one variant. -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,144,600;1,144,500&family=Inter:wght@400;500&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; }
  .tarjeta { width: 1200px; height: 630px; box-sizing: border-box; padding: 72px 84px; background: #faf7f4;
    display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden;
    font-family: "Inter", Arial, sans-serif; color: #1a1517; }
  .brillo { position: absolute; width: 760px; height: 760px; border-radius: 50%; right: -260px; top: -300px;
    background: radial-gradient(circle, rgba(180,83,42,0.22), rgba(180,83,42,0) 65%); }
  .marca { display: flex; align-items: center; gap: 22px; }
  .c { width: 88px; height: 88px; border-radius: 50%; background: #8d4526; color: #fdfaf6;
    display: flex; align-items: center; justify-content: center; font: 600 62px/1 "Fraunces", serif; }
  .c span { transform: translateY(-3px); }
  .nombre { font: 600 52px/1 "Fraunces", serif; letter-spacing: -0.02em; }
  h1 { margin: 0; font: 600 96px/0.98 "Fraunces", serif; letter-spacing: -0.035em; max-width: 900px; }
  h1 em { font-style: italic; font-weight: 500; color: #8d4526; }
  .pie { display: flex; justify-content: space-between; align-items: flex-end; font-size: 26px; color: #6d635e; }
  .pie b { color: #1a1517; font-weight: 500; }
</style>
</head>
<body>
  <div class="tarjeta" id="tarjeta">
    <div class="brillo"></div>
    <div class="marca"><div class="c"><span>C</span></div><div class="nombre">ClosetAI</div></div>
    <h1>Wear what you <em>already own.</em></h1>
    <div class="pie"><span>AI personal stylist · Made in Mexico</span><b>closetai.lat</b></div>
  </div>
</body>
</html>
